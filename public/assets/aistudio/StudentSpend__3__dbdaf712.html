<html lang="en" data-theme="light"><head><meta charset="utf-8">

<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#10213f;--mu:#5b6985;--nv:#0f2748;--ac:#0e9f78;--wa:#c98a06;--er:#cf3f58;--bd:#dce2ee;--ef:#e9eefb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1322;--card:#12203a;--tx:#e8eefb;--mu:#9aa8c6;--nv:#6c97f0;--bd:#24345a;--ef:#1a2c52;--ac:#2fd0a0;--wa:#e8b23a;--er:#ef6c82;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:210px;background:#0f2748;color:#fff;padding:20px 12px;flex-shrink:0;position:sticky;top:0;height:100vh}
nav h1{font-size:19px;margin:0 8px 18px;letter-spacing:.2px}
nav a{display:block;color:#c5d3ee;text-decoration:none;padding:9px 12px;border-radius:8px;margin-bottom:3px}
nav a.on,nav a:hover{background:#1d3c6b;color:#fff}
main{flex:1;padding:24px;max-width:1000px;min-width:0}
h2{margin:0 0 4px;font-size:22px}p.sub{margin:0 0 18px;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.g .c{margin:0}.c h3{margin:0 0 10px;font-size:15px}
.k{color:var(--mu);font-size:13px}.v{font-size:24px;font-weight:700}
.pos{color:var(--ac)}.neg{color:var(--er)}
input,select,textarea,button{font:inherit;padding:8px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{background:var(--nv);color:#fff;border:0;cursor:pointer;font-weight:600}
button.s{background:transparent;color:var(--er);border:1px solid var(--bd);padding:3px 9px;font-weight:500}
button.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
:focus-visible{outline:2px solid var(--nv);outline-offset:2px}
.f{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.f>*{flex:1 1 130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:13px}
.bar{height:10px;background:var(--ef);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.bar.w i{background:var(--wa)}.bar.x i{background:var(--er)}
.row{display:flex;justify-content:space-between;gap:8px;margin:10px 0 4px}
.cols{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:8px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mu)}
.cols span{display:flex;align-items:flex-end;gap:3px;height:120px}.cols b{width:16px;border-radius:3px 3px 0 0;display:block}
.msg{padding:10px 12px;border-radius:8px;margin-bottom:14px;background:var(--ef)}.msg.e{background:color-mix(in srgb,var(--er) 18%,var(--card))}.msg.w{background:color-mix(in srgb,var(--wa) 20%,var(--card))}
.note{font-size:13px;color:var(--mu)}
@media(max-width:720px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:10px;gap:4px}nav h1{display:none}nav a{white-space:nowrap;margin:0}main{padding:16px}}
body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;background-image:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--ac) 12%,transparent),transparent 40%)}
nav{background:linear-gradient(180deg,#0b1f3d,#12335f);padding:22px 14px}
nav h1{font-size:20px;font-weight:800;display:flex;align-items:center}
nav h1:before{content:"\20B9";display:inline-grid;place-items:center;width:32px;height:32px;margin-right:9px;border-radius:10px;background:linear-gradient(135deg,#19c39a,#5b8def);color:#fff;font-size:17px}
nav a{padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
nav a.on{background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 #19c39a}
h2{font-size:28px;font-weight:800;letter-spacing:-.4px}
.c{border-radius:16px;box-shadow:0 8px 26px -14px rgba(15,39,72,.35);padding:20px}
.g .c{border-top:3px solid var(--nv)}.g .c:nth-child(2){border-top-color:var(--ac)}.g .c:nth-child(3){border-top-color:var(--er)}.g .c:nth-child(4){border-top-color:var(--wa)}
.hero{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;margin-bottom:16px;padding:26px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#0f2748 0%,#1b4b8f 55%,#14a98a 130%);box-shadow:0 20px 40px -20px rgba(15,39,72,.8)}
.hero .k{color:#c9d8f3}.big{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.pills span{display:inline-block;margin:4px 6px 0 0;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.15);font-size:13px;font-weight:600}
button{border-radius:10px;padding:9px 16px;background:linear-gradient(135deg,#1b4b8f,#0f2748)}
input,select{border-radius:10px;padding:9px 12px}
.bar{height:12px;border-radius:99px}.bar i{border-radius:99px;background:linear-gradient(90deg,#14a98a,#5bd1b0)}
.bar.w i{background:linear-gradient(90deg,#e8a317,#f3c75c)}.bar.x i{background:linear-gradient(90deg,#cf3f58,#ef7a8e)}
.cols{height:180px}.cols span{height:150px}.cols b{width:22px;border-radius:6px 6px 0 0}
tr:hover td{background:color-mix(in srgb,var(--ef) 55%,transparent)}
.msg{border-left:4px solid var(--nv);border-radius:12px}.msg.e{border-left-color:var(--er)}.msg.w{border-left-color:var(--wa)}
.c.ai{border-color:color-mix(in srgb,var(--ac) 50%,var(--bd));background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 9%,var(--card)),var(--card))}
.c.ai h3:before{content:"\2726  ";color:var(--ac)}
@media(max-width:720px){.big{font-size:34px}h2{font-size:24px}nav a.on{box-shadow:none}}
nav{background:var(--side);color:var(--tx);border-right:1px solid var(--bd)}
nav h1{color:var(--tx)}nav a{color:var(--mu)}
nav a.on,nav a:hover{background:var(--ef);color:var(--nv)}nav a.on{box-shadow:inset 3px 0 0 var(--ac)}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:0 18px 36px -20px var(--h1)}.hero .k{color:rgba(255,255,255,.9)}
button{background:linear-gradient(135deg,var(--nv),var(--ac))}button.s,button.o{background:transparent}
button.sel{background:var(--ef);color:var(--nv);border-color:var(--nv)}
.g .c{border-top-color:var(--nv)}.g .c:nth-child(2){border-top-color:var(--ac)}
input[type=color]{padding:2px;height:36px;width:56px;vertical-align:middle}
@media(max-width:720px){nav{border-right:0;border-bottom:1px solid var(--bd)}}
</style>
<style>
.pw{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.pie{width:170px;height:170px;border-radius:50%;flex-shrink:0}.lg{margin:5px 0;font-size:14px}.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.fb{padding:12px 16px;border-radius:12px;background:var(--ef);border:1px solid var(--bd);min-width:120px}.fb b{display:block;font-size:17px}.fa{font-size:22px;color:var(--mu)}.fc{display:flex;flex-direction:column;gap:8px}
.mo{position:fixed;inset:0;background:rgba(10,20,40,.45);display:grid;place-items:center;z-index:50;padding:16px}.mb{background:var(--card);border-radius:16px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}.mb input{width:100%;margin-bottom:10px}
.badge{background:var(--er);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;margin-left:6px}
body.ro main button,body.ro main input,body.ro main select{display:none}
body.na nav,body.na main{display:none}
body.na #tb{display:none}
#tb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;z-index:30;display:flex;gap:8px;align-items:center}
.tbb{border-radius:99px;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.av{width:40px;height:40px;border-radius:50%;padding:0;font-weight:800;font-size:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--nv),var(--ac));color:#fff;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.av.big2{width:56px;height:56px;font-size:22px;flex-shrink:0}

</style></head><body>
<nav aria-label="Main"><h1>StudentSpend</h1><div id="who" class="note" style="margin:-8px 8px 14px"></div>
<a href="#dashboard">🏠 Dashboard</a><a href="#transactions">💸 Transactions</a><a href="#budgets">🎯 Budgets</a><a href="#savings">🐷 Savings</a><a href="#emergency">🛡️ Emergency Fund</a><a href="#insights">✨ Insights &amp; AI</a><a href="#categories">🏷️ Categories</a><a href="#share">🔗 Share</a><a href="#statement">🧾 Statement</a><a href="#trash">🗑️ Recently deleted</a><a href="#settings">⚙️ Settings</a><a href="#" onclick="signOut();return false">🚪 Sign out</a></nav>
<div id="tb"><button class="av" id="av" onclick="showProfile()" aria-label="View profile">S</button></div>
<main id="m"></main>
<script>
const DEF=["Food","Transport","Education","Hostel","Shopping","Entertainment","Bills","Health","Travel","Pocket Money","Other"];
let S={tx:[],cats:[],budgets:{},overall:0,hard:false,ef:[],efTarget:0,goals:[],imports:[]};
try{const r=localStorage.getItem("ss1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let flash=null,wd=null;
const save=()=>{if(RO)return;try{localStorage.setItem(UK,JSON.stringify(S))}catch(e){}pushDb()};let RO=false,dbDoc=null,pt=null,UK='ss1',USER=null;
const R=n=>"₹"+(Math.round(n*100)/100).toLocaleString("en-IN");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const allCats=()=>[...DEF,...S.cats];
const today=()=>new Date().toISOString().slice(0,10);
const mo=d=>d.slice(0,7);const curMo=()=>today().slice(0,7);
const sum=a=>a.reduce((t,x)=>t+x.amount,0);
const inc=()=>sum(S.tx.filter(t=>t.type=="income"));
const exp=()=>sum(S.tx.filter(t=>t.type=="expense"));
const efBal=()=>sum(S.ef.filter(e=>e.kind=="contribute"))-sum(S.ef.filter(e=>e.kind=="withdraw"));
const gSaved=()=>S.goals.reduce((t,g)=>t+g.saved,0);
const avail=()=>inc()-exp()-efBal()-gSaved();
const spent=(cat,m)=>sum(S.tx.filter(t=>t.type=="expense"&&mo(t.date)==m&&(!cat||t.cat==cat)));
function pb(p){const c=p>=100?"x":p>=80?"w":"";return `<div class="bar ${c}"><i style="width:${Math.min(p,100)}%"></i></div>`}
function lvl(p){return p>=100?"Budget exceeded":p>=80?"Budget warning":"Normal"}
function notice(){const f=flash;flash=null;return f?`<div class="msg ${f[0]}" role="status">${esc(f[1])}</div>`:""}
function catOpts(sel){return allCats().map(c=>`<option ${c==sel?"selected":""}>${esc(c)}</option>`).join("")}
const $=id=>document.getElementById(id);

function dashboard(){
 const m=curMo(),ms=spent(null,m),rem=S.overall?S.overall-ms:null;
 const months=[...new Set(S.tx.map(t=>mo(t.date)))].sort().slice(-6);
 const mx=Math.max(1,...months.map(x=>Math.max(sum(S.tx.filter(t=>t.type=="income"&&mo(t.date)==x)),spent(null,x))));
 const bars=months.map(x=>{const i=sum(S.tx.filter(t=>t.type=="income"&&mo(t.date)==x)),e=spent(null,x);
  return `<div><span><b style="height:${i/mx*100}%;background:var(--ac)" title="Income ${R(i)}"></b><b style="height:${e/mx*100}%;background:var(--er)" title="Expenses ${R(e)}"></b></span>${x}</div>`}).join("");
 const bycat={};S.tx.filter(t=>t.type=="expense"&&mo(t.date)==m).forEach(t=>bycat[t.cat]=(bycat[t.cat]||0)+t.amount);
 const cr=Object.entries(bycat).sort((a,b)=>b[1]-a[1]);
 const recent=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,5);
 return `<h2>Dashboard</h2><p class="sub">Everything below is calculated from your saved entries.</p>${notice()}
 ${!S.tx.length?`<div class="msg">No transactions yet. <a href="#transactions">Add your first pocket money entry</a> to get started.</div>`:""}
 <div class="hero"><div><div class="k">Available to spend</div><div class="big">${R(avail())}</div><div class="k">Money you can use right now</div></div><div class="pills"><span>🛡️ Emergency ${R(efBal())}</span><span>🐷 Goals ${R(gSaved())}</span></div></div>
 <div class="g">
 <div class="c"><div class="k">Total received</div><div class="v">${R(inc())}</div></div>
 <div class="c"><div class="k">Total spent</div><div class="v">${R(exp())}</div></div>
 <div class="c"><div class="k">Emergency Fund (protected)</div><div class="v">${R(efBal())}</div></div>
 <div class="c"><div class="k">Monthly budget</div><div class="v">${S.overall?R(S.overall):"Not set"}</div><div class="note">${rem===null?"":"Remaining: "+R(rem)}</div></div></div>
 <div class="c"><h3>Income vs expenses by month</h3>${months.length?`<div class="cols">${bars}</div><div class="note">Green: income · Red: expenses</div>`:`<div class="note">Add transactions to see this chart.</div>`}</div>
 <div class="c"><h3>This month’s spending by category</h3>${cr.length?cr.map(([c,a])=>`<div class="row"><span>${esc(c)}</span><span>${R(a)} (${Math.round(a/ms*100)}%)</span></div><div class="bar"><i style="width:${a/ms*100}%"></i></div>`).join(""):`<div class="note">No expenses this month.</div>`}</div>
 <div class="c"><h3>Recent transactions</h3>${recent.length?`<div class="tw"><table>${recent.map(t=>`<tr><td>${t.date}</td><td>${esc(t.desc)}</td><td>${esc(t.cat)}</td><td class="${t.type=="income"?"pos":"neg"}">${t.type=="income"?"+":"−"}${R(t.amount)}</td></tr>`).join("")}</table></div>`:`<div class="note">Nothing yet.</div>`}</div>`}

function transactions(){
 const q=($("q")||{}).value||"",fc=($("fc")||{}).value||"",ft=($("ft")||{}).value||"",so=($("so")||{}).value||"date";
 let L=S.tx.filter(t=>t.desc.toLowerCase().includes(q.toLowerCase())&&(!fc||t.cat==fc)&&(!ft||t.type==ft));
 L.sort(so=="amt"?(a,b)=>b.amount-a.amount:(a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 return `<h2>Transactions</h2><p class="sub">Pocket money can arrive in any amount on any date. Add each entry as it happens.</p>${notice()}
 <div class="c"><h3>Add transaction</h3><div class="f">
 <select id="ty" aria-label="Type"><option value="income">Income</option><option value="expense" selected>Expense</option></select>
 <input id="de" placeholder="Description" aria-label="Description"><input id="am" type="number" min="0.01" step="0.01" placeholder="Amount (₹)" aria-label="Amount">
 <select id="ca" aria-label="Category">${catOpts("Food")}</select><input id="da" type="date" value="${today()}" aria-label="Date"></div>
 <button onclick="addTx()">Save transaction</button> <span class="note">Income and expenses only. Emergency Fund transfers live on their own page.</span></div>
 <div class="c"><div class="f"><input id="q" value="${esc(q)}" placeholder="Search description" oninput="go()" aria-label="Search">
 <select id="fc" onchange="go()" aria-label="Filter category"><option value="">All categories</option>${catOpts(fc)}</select>
 <select id="ft" onchange="go()" aria-label="Filter type"><option value="">Income and expense</option><option value="income" ${ft=="income"?"selected":""}>Income</option><option value="expense" ${ft=="expense"?"selected":""}>Expense</option></select>
 <select id="so" onchange="go()" aria-label="Sort"><option value="date">Newest first</option><option value="amt" ${so=="amt"?"selected":""}>Largest first</option></select></div>
 ${L.length?`<div class="tw"><table><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr>${L.map(t=>`<tr><td>${t.date}</td><td>${esc(t.desc)}</td><td>${esc(t.cat)}</td><td class="${t.type=="income"?"pos":"neg"}">${t.type=="income"?"+":"−"}${R(t.amount)}</td><td><button class="s" onclick="delTx(${t.id})">Delete</button></td></tr>`).join("")}</table></div>`:`<div class="note">No matching transactions.</div>`}</div>`}

function addTx(){
 const type=$("ty").value,desc=$("de").value.trim(),amount=parseFloat($("am").value),cat=type=="income"?"Pocket Money":$("ca").value,date=$("da").value;
 if(!desc||!(amount>0)||!date){flash=["e","Enter a description, a positive amount and a date."];return render()}
 if(type=="expense"){
  if(amount>avail()){flash=["e","This expense is more than your available balance of "+R(avail())+". Add income first, or move money back from the Emergency Fund only if it is a genuine emergency."];return render()}
  const m=date.slice(0,7),cb=S.budgets[cat];
  if(S.hard||(S.strict&&S.strict[cat])){
   if(cb&&spent(cat,m)+amount>cb){flash=["e",`Blocked by your in-app limit: ${cat} budget is ${R(cb)} and you have spent ${R(spent(cat,m))}. Raise the limit on the Budgets page to continue.`];return render()}
   if(S.hard&&S.overall&&spent(null,m)+amount>S.overall){flash=["e",`Blocked by your in-app limit: monthly budget ${R(S.overall)} would be exceeded. Raise the limit on the Budgets page to continue.`];return render()}}
 }
 S.tx.push({id:Date.now(),type,desc,amount,cat,date});save();
 let msg="Saved.";const m=date.slice(0,7);
 if(type=="expense"){const cb=S.budgets[cat];if(cb&&spent(cat,m)>=cb*0.8)msg=`Saved. ${cat} budget: ${lvl(spent(cat,m)/cb*100)} (${Math.round(spent(cat,m)/cb*100)}%).`;
  else if(S.overall&&spent(null,m)>=S.overall*0.8)msg=`Saved. Monthly budget: ${lvl(spent(null,m)/S.overall*100)}.`}
 flash=["",msg];render()}
function delTx(id){if(confirm("Delete this transaction? This cannot be undone.")){S.tx=S.tx.filter(t=>t.id!=id);save();flash=["","Transaction deleted."];render()}}

function budgets(){
 const m=curMo(),ms=spent(null,m),op=S.overall?ms/S.overall*100:0;
 return `<h2>Budgets</h2><p class="sub">Spending for ${m}.</p>${notice()}
 <div class="c"><h3>Monthly limit</h3><div class="f"><input id="ov" type="number" min="0" value="${S.overall||""}" placeholder="Overall monthly budget (₹)" aria-label="Overall budget"><button onclick="setOv()">Save limit</button></div>
 ${S.overall?`<div class="row"><span>${R(ms)} of ${R(S.overall)}</span><span>${Math.round(op)}% · ${lvl(op)}</span></div>${pb(op)}`:`<div class="note">No monthly limit set.</div>`}
 <p><label><input type="checkbox" ${S.hard?"checked":""} onchange="S.hard=this.checked;save();render()"> In-app spending restriction: refuse to record expenses that exceed a limit</label></p>
 <div class="note">Warning mode (default) only alerts you. Restriction mode applies inside StudentSpend only. It cannot block real UPI, card or bank payments.</div></div>
 <div class="c"><h3>Category budgets</h3><div class="f"><select id="bc" aria-label="Category">${catOpts("")}</select><input id="ba" type="number" min="1" placeholder="Amount (₹)" aria-label="Category budget"><button onclick="setB()">Set budget</button></div>
 ${Object.keys(S.budgets).length?Object.entries(S.budgets).map(([c,b])=>{const s=spent(c,m),p=s/b*100;return `<div class="row"><span>${esc(c)} <button class="s" onclick="delB('${esc(c).replace(/'/g,"\\'")}')">Remove</button> <label class="note"><input type="checkbox" ${S.strict&&S.strict[c]?"checked":""} onchange="setStrict('${esc(c).replace(/'/g,"\\'")}',this.checked)"> Strict limit</label></span><span>${R(s)} of ${R(b)} · ${Math.round(p)}% · ${lvl(p)}</span></div>${pb(p)}`}).join(""):`<div class="note">No category budgets yet.</div>`}</div>`}
function setOv(){const v=parseFloat($("ov").value);if(!(v>=0)){flash=["e","Enter a valid amount."];return render()}S.overall=v;save();flash=["","Monthly limit saved."];render()}
function setB(){const v=parseFloat($("ba").value),c=$("bc").value;if(!(v>0)){flash=["e","Enter a positive budget amount."];return render()}S.budgets[c]=v;save();flash=["",`${c} budget saved.`];render()}
function delB(c){delete S.budgets[c];save();render()}

function emergency(){
 const con=sum(S.ef.filter(e=>e.kind=="contribute")),wdw=sum(S.ef.filter(e=>e.kind=="withdraw")),p=S.efTarget?efBal()/S.efTarget*100:0;

  <button onclick="doWd()">Yes, withdraw ${R(wd.amt)}</button> <button class="o" onclick="wd=null;render()">Cancel</button></div>`
  :`<div class="f"><input id="wa" type="number" min="1" placeholder="Amount (₹)" aria-label="Withdrawal amount"><select id="wr" aria-label="Reason">${reasons.map(r=>`<option>${r}</option>`).join("")}</select><input id="wn" placeholder="Optional explanation" aria-label="Explanation"></div><button onclick="reqWd()">Withdraw for Emergency</button>`;

 <div class="g"><div class="c"><div class="k">Balance</div><div class="v">${R(efBal())}</div></div><div class="c"><div class="k">Contributed</div><div class="v">${R(con)}</div></div><div class="c"><div class="k">Withdrawn</div><div class="v">${R(wdw)}</div></div><div class="c"><div class="k">Available to spend</div><div class="v">${R(avail())}</div></div></div>

 <div class="c"><h3>Add to Emergency Fund</h3><div class="f"><input id="ca2" type="number" min="1" placeholder="Amount (₹)" aria-label="Contribution"><input id="cn" placeholder="Optional note" aria-label="Note"></div><button onclick="contrib()">Reserve money</button></div>

 <p class="note">This is an app-level safeguard, not a bank lock. It cannot stop you from spending the real money elsewhere.</p>`}
function contrib(){const a=parseFloat($("ca2").value);if(!(a>0)){flash=["e","Enter a positive amount."];return render()}
 if(a>avail()){flash=["e","You only have "+R(avail())+" available to reserve."];return render()}
 S.ef.push({id:Date.now(),kind:"contribute",amount:a,note:$("cn").value.trim(),date:today()});save();flash=["",R(a)+" moved into protected savings."];render()}
function reqWd(){const a=parseFloat($("wa").value);if(!(a>0)){flash=["e","Enter a positive amount."];return render()}
 if(a>efBal()){flash=["e","Withdrawal is more than the Emergency Fund balance of "+R(efBal())+"."];return render()}

function categories(){
 return `<h2>Categories</h2><p class="sub">Custom categories work in transactions, budgets and filters.</p>${notice()}
 <div class="c"><h3>Add category</h3><div class="f"><input id="nc" placeholder="e.g. Stationery" aria-label="New category"><button onclick="addCat()">Add category</button></div></div>
 <div class="c"><h3>Your categories</h3>${S.cats.length?S.cats.map((c,i)=>`<div class="row"><span>${esc(c)} <span class="note">(${S.tx.filter(t=>t.cat==c).length} transactions)</span></span><span><button class="o" onclick="renCat(${i})">Rename</button> <button class="s" onclick="delCat(${i})">Delete</button></span></div>`).join(""):`<div class="note">None yet.</div>`}
 <p class="note">Built-in: ${DEF.join(", ")}</p></div>`}
const norm=s=>s.trim().replace(/\s+/g," ");
const dup=n=>allCats().some(c=>c.toLowerCase()==n.toLowerCase());
function addCat(){const n=norm($("nc").value);if(!n){flash=["e","Category name cannot be empty."];return render()}
 if(dup(n)){flash=["e","That category already exists."];return render()}S.cats.push(n);save();flash=["",n+" added."];render()}
function renCat(i){const old=S.cats[i],n=norm(prompt("New name for "+old,old)||"");if(!n||n==old)return;
 if(dup(n)){flash=["e","That name is already used."];return render()}
 S.tx.forEach(t=>{if(t.cat==old)t.cat=n});if(S.budgets[old]!=null){S.budgets[n]=S.budgets[old];delete S.budgets[old]}if(S.strict&&S.strict[old]){S.strict[n]=true;delete S.strict[old]}S.cats[i]=n;save();flash=["","Renamed everywhere."];render()}
function delCat(i){const c=S.cats[i],n=S.tx.filter(t=>t.cat==c).length;
 if(n&&!confirm(`${n} transactions use "${c}". They will be moved to "Other", not deleted. Continue?`))return;
 if(!n&&!confirm(`Delete "${c}"?`))return;
 S.tx.forEach(t=>{if(t.cat==c)t.cat="Other"});delete S.budgets[c];if(S.strict)delete S.strict[c];S.cats.splice(i,1);save();flash=["","Category deleted. Transactions kept."];render()}

 <div class="c"><h3>Not in this version</h3><p class="note">Not built here: full analytics page, flowchart page, settings page and a server database. There is no bank or UPI connection. The optional AI box on Insights uses Claude in the cloud, not a local model.</p></div>`}

function savings(){return `<h2>Savings goals</h2><p class="sub">Money in goals is set aside from your spendable balance. It is separate from the Emergency Fund.</p>${notice()}
<div class="g"><div class="c"><div class="k">Total in goals</div><div class="v">${R(gSaved())}</div></div><div class="c"><div class="k">Available to spend</div><div class="v">${R(avail())}</div></div></div>
<div class="c"><h3>New goal</h3><div class="f"><input id="gn" placeholder="Goal name" aria-label="Goal name"><input id="gt" type="number" min="1" placeholder="Target (₹)" aria-label="Target"><input id="gd" type="date" aria-label="Optional target date"></div><button onclick="addGoal()">Create goal</button></div>
${S.goals.length?S.goals.map(g=>{const p=g.saved/g.target*100;return `<div class="c"><h3>${esc(g.name)}</h3><div class="row"><span>${R(g.saved)} of ${R(g.target)}${g.date?" · by "+g.date:""}</span><span>${Math.round(p)}%</span></div><div class="bar"><i style="width:${Math.min(p,100)}%"></i></div>
<div class="f" style="margin-top:10px"><input id="gc${g.id}" type="number" min="1" placeholder="Amount (₹)" aria-label="Contribution"><button onclick="goalAdd(${g.id})">Add money</button><button class="s" onclick="delGoal(${g.id})">Delete goal</button></div>
${g.hist.length?`<div class="note">History: ${g.hist.map(h=>h.date+" "+R(h.amount)).join(" · ")}</div>`:""}</div>`}).join(""):`<div class="msg">No goals yet. Create one above.</div>`}`}
function addGoal(){const n=norm($("gn").value),t=parseFloat($("gt").value);if(!n||!(t>0)){flash=["e","Enter a goal name and a positive target."];return render()}
S.goals.push({id:Date.now(),name:n,target:t,date:$("gd").value,saved:0,hist:[]});save();flash=["","Goal created."];render()}
function goalAdd(id){const g=S.goals.find(x=>x.id==id),a=parseFloat($("gc"+id).value);if(!(a>0)){flash=["e","Enter a positive amount."];return render()}
if(a>avail()){flash=["e","You only have "+R(avail())+" available."];return render()}
g.saved+=a;g.hist.push({date:today(),amount:a});save();flash=["",R(a)+" added to "+g.name+"."];render()}

let imp=null;
const CK={Food:/zomato|swiggy|cafe|restaurant|canteen|mess|pizza|food/i,Transport:/uber|ola|rapido|metro|bus|irctc|petrol|fuel/i,Education:/book|course|udemy|fees|exam|print/i,Entertainment:/netflix|spotify|movie|bookmyshow|game/i,Shopping:/amazon|flipkart|myntra|ajio/i,Bills:/recharge|jio|airtel|electric|wifi|bill/i,Health:/pharm|medic|hospital|clinic/i};
const suggest=d=>{for(const[c,r]of Object.entries(CK))if(r.test(d))return c;return"Other"};
function parseCSV(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}
function nd(s){s=s.trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:null}
const num=s=>parseFloat(String(s||"").replace(/[₹,\s]/g,""));
function onFile(f){if(!f)return;if(!/\.csv$/i.test(f.name)){flash=["e","Please choose a .csv file."];return render()}
const rd=new FileReader();rd.onload=()=>{const rows=parseCSV(String(rd.result));if(rows.length<2){flash=["e","The file has no data rows."];return render()}
const h=rows[0].map(x=>x.trim().toLowerCase()),col=(...n)=>h.findIndex(x=>n.some(k=>x.includes(k)));
const di=col("date"),ds=col("desc","narration","particular","details","merchant"),ai=col("amount"),db=col("debit","withdraw"),cr=col("credit","deposit"),ti=col("type","dr/cr");
if(di<0||ds<0||(ai<0&&db<0&&cr<0)){flash=["e","Could not find columns. The file needs date, description and amount (or debit and credit) columns."];return render()}
imp=rows.slice(1).map(r=>{const date=nd(r[di]||"");let amount=0,type="expense";
if(ai>=0){const v=num(r[ai]);amount=Math.abs(v);type=v<0?"expense":"income";if(ti>=0){const t=(r[ti]||"").toLowerCase();if(/cr|credit|income/.test(t))type="income";else if(/dr|debit|expense/.test(t))type="expense"}}
else{const d=num(r[db])||0,c=num(r[cr])||0;if(c>0){amount=c;type="income"}else amount=d}
const desc=(r[ds]||"").trim(),ok=!!date&&amount>0&&!!desc;
const isDup=ok&&S.tx.some(t=>t.date==date&&t.amount==amount&&t.type==type&&t.desc.toLowerCase()==desc.toLowerCase());
return{date,desc,amount,type,cat:type=="income"?"Pocket Money":suggest(desc),ok,isDup,use:ok&&!isDup}});render()};rd.readAsText(f)}
function importPage(){return `<h2>Import CSV</h2><p class="sub">Upload a statement you downloaded yourself. Nothing is saved until you confirm.</p>${notice()}
<div class="c"><input type="file" accept=".csv" onchange="onFile(this.files[0])" aria-label="CSV file"><p class="note">Needs date, description and amount columns (or separate debit and credit columns). With a single amount column and no type column, negative amounts are read as expenses and positive as income. StudentSpend never asks for bank passwords, UPI PINs or OTPs, and has no live bank link.</p></div>
${imp?`<div class="c"><h3>Preview: ${imp.length} rows</h3><div class="tw"><table><tr><th>Use</th><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th>Amount</th><th>Status</th></tr>
${imp.map((x,i)=>`<tr><td><input type="checkbox" ${x.use?"checked":""} ${x.ok?"":"disabled"} onchange="imp[${i}].use=this.checked" aria-label="Import row ${i+1}"></td><td>${x.date||"?"}</td><td><input value="${esc(x.desc)}" onchange="imp[${i}].desc=this.value"></td><td><select onchange="imp[${i}].cat=this.value">${catOpts(x.cat)}</select></td><td>${x.type}</td><td>${x.amount?R(x.amount):"?"}</td><td>${!x.ok?"Invalid row":x.isDup?"Possible duplicate":"New"}</td></tr>`).join("")}</table></div>
<p><button onclick="commitImp()">Import selected rows</button> <button class="o" onclick="imp=null;render()">Cancel</button></p></div>`:""}
<div class="c"><h3>Import history</h3>${S.imports.length?`<div class="tw"><table>${[...S.imports].reverse().map(h=>`<tr><td>${esc(h.date)}</td><td>${h.n} imported</td><td>${h.skipped} skipped</td></tr>`).join("")}</table></div>`:`<div class="note">No imports yet.</div>`}</div>`}
function commitImp(){const rows=imp.filter(x=>x.use&&x.ok&&x.desc.trim());if(!rows.length){flash=["e","Select at least one valid row."];return render()}
rows.forEach((x,i)=>S.tx.push({id:Date.now()+i,type:x.type,desc:x.desc.trim(),amount:x.amount,cat:x.cat,date:x.date,src:"csv"}));
S.imports.push({date:new Date().toLocaleString(),n:rows.length,skipped:imp.length-rows.length});const n=rows.length;imp=null;save();flash=["",`Imported ${n} transactions.`];render()}

let ans="";
const pmo=()=>{const d=new Date(),p=new Date(d.getFullYear(),d.getMonth()-1,1);return p.getFullYear()+"-"+String(p.getMonth()+1).padStart(2,"0")};
const QS=[["How much can I spend?",()=>`You have ${R(avail())} available to spend. ${R(efBal())} is protected in the Emergency Fund and ${R(gSaved())} is set aside in savings goals.`],
["Where did most of my money go this month?",()=>{const b={};S.tx.filter(t=>t.type=="expense"&&mo(t.date)==curMo()).forEach(t=>b[t.cat]=(b[t.cat]||0)+t.amount);const e=Object.entries(b).sort((a,c)=>c[1]-a[1]);return e.length?`${e[0][0]} is your biggest category at ${R(e[0][1])}.${e.length>1?" Next: "+e.slice(1,3).map(x=>x[0]+" "+R(x[1])).join(", ")+".":""}`:"No expenses recorded this month yet."}],
["Am I close to my budget?",()=>{if(!S.overall)return"You have not set a monthly budget yet. Set one on the Budgets page.";const s=spent(null,curMo()),p=s/S.overall*100;return `You have spent ${R(s)} of ${R(S.overall)} (${Math.round(p)}%): ${lvl(p)}. Remaining: ${R(Math.max(0,S.overall-s))}.`}],
["How does this month compare with last month?",()=>{const a=spent(null,curMo()),b=spent(null,pmo());if(!b)return"No spending was recorded last month, so there is nothing to compare with.";const d=a-b;return `This month ${R(a)}, last month ${R(b)}: ${d>=0?"up":"down"} ${R(Math.abs(d))} (${Math.round(Math.abs(d)/b*100)}%).`}],
["How much have I saved?",()=>`Emergency Fund: ${R(efBal())}. Savings goals: ${R(gSaved())}. Total set aside: ${R(efBal()+gSaved())}.`],
["How can I spread my remaining money?",()=>{const left=S.overall?S.overall-spent(null,curMo()):avail(),dt=new Date(),days=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()-dt.getDate()+1;return left>0?`You have ${R(left)} left ${S.overall?"in this month's budget":"to spend"} and ${days} days left in the month, about ${R(left/days)} per day.`:"You have no spendable amount left under your current limit."}]];
function ask(i){ans=QS[i][1]();render()}
function insights(){return `<h2>Insights</h2><p class="sub">Quick answers are calculated on your device. For anything else, ask the AI assistant below.</p>${notice()}
<div class="c"><div class="f">${QS.map((q,i)=>`<button class="o" onclick="ask(${i})">${q[0]}</button>`).join("")}</div>${ans?`<div class="msg" role="status">${esc(ans)}</div>`:`<div class="note">Pick a question.</div>`}</div>
<div class="c ai"><h3>Ask the AI assistant</h3><p class="note">When you press Ask, a summary of your records (totals, categories, budgets, recent transactions) is sent to Claude. It runs in the cloud, not on your device. It can explain and suggest, but it cannot change your records.</p>
<div class="f"><input id="aq" placeholder="e.g. How can I cut my food spending?" aria-label="Question for AI" onkeydown="if(event.key=='Enter')askAI()"><button id="ab" onclick="askAI()">Ask AI</button></div><div id="ao" class="msg" role="status" style="display:none;white-space:pre-wrap"></div></div>`}

function ctx(){const m=curMo(),b={};S.tx.filter(t=>t.type=="expense"&&mo(t.date)==m).forEach(t=>b[t.cat]=(b[t.cat]||0)+t.amount);
return JSON.stringify({currency:"INR",month:m,available:avail(),totalIncome:inc(),totalExpenses:exp(),emergencyFund:efBal(),goalsSaved:gSaved(),monthlyBudget:S.overall||null,thisMonthSpendByCategory:b,lastMonthSpend:spent(null,pmo()),categoryBudgets:S.budgets,goals:S.goals.map(g=>({name:g.name,target:g.target,saved:g.saved})),recentTransactions:[...S.tx].sort((a,c)=>c.date.localeCompare(a.date)).slice(0,30).map(t=>({date:t.date,type:t.type,desc:t.desc,category:t.cat,amount:t.amount}))})}
async function askAI(){const q=$("aq").value.trim(),o=$("ao");if(!q)return;o.style.display="block";
const sample=window.claude?await window.claude.use("sample"):null;
if(!sample){o.textContent="The AI assistant is not available in this view. Use the question buttons above.";return}
o.textContent="Thinking…";$("ab").disabled=true;
try{const r=await sample(`You are a friendly money coach for an Indian college student. Use ONLY the figures in the JSON below and never invent numbers. If data is missing, say so. Answer in under 150 words, in plain language, with amounts in ₹. You cannot change records; suggest actions the student can take themselves.\n\nDATA:\n${ctx()}\n\nQUESTION: ${q}`,{cache:false,modelTier:"quick",onText:({text})=>{o.textContent=text}});o.textContent=r.text}
catch(e){o.textContent=e&&e.code=="not_granted"?"Permission was not granted, so the AI can’t answer.":"The AI could not answer right now. Try again later."}
$("ab").disabled=false}

function line(L,ser,fmt){fmt=fmt||(l=>l.slice(2));const W=560,H=200,p=30,mx=Math.max(1,...ser.flatMap(s=>s.v)),X=i=>p+(L.length>1?i*(W-2*p)/(L.length-1):(W-2*p)/2),Y=v=>H-p-v/mx*(H-2*p),step=Math.ceil(L.length/8),r=L.length>14?2.5:4.5;
return `<svg viewBox='0 0 ${W} ${H}' style='width:100%;height:auto' role='img' aria-label='Income and expense trend'>${[0,.5,1].map(f=>`<line x1='${p}' y1='${Y(mx*f)}' x2='${W-p}' y2='${Y(mx*f)}' stroke='#9aa8c6' stroke-opacity='.35'/><text x='${p-4}' y='${Y(mx*f)+4}' font-size='10' text-anchor='end' fill='#9aa8c6'>${Math.round(mx*f)}</text>`).join('')}${ser.map(s=>`<polyline fill='none' stroke='${s.c}' stroke-width='3' stroke-linejoin='round' points='${s.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}'/>${s.v.map((v,i)=>`<circle cx='${X(i)}' cy='${Y(v)}' r='${r}' fill='${s.c}'><title>${s.n} ${L[i]}: ${R(v)}</title></circle>`).join('')}`).join('')}${L.map((l,i)=>i%step==0||i==L.length-1?`<text x='${X(i)}' y='${H-8}' font-size='10' text-anchor='middle' fill='#9aa8c6'>${fmt(l)}</text>`:'').join('')}</svg><div class='note'><span style='color:#12a594'>\u25cf</span> Income <span style='color:#e0536a'>\u25cf</span> Expenses (amounts in \u20b9)</div>`}

function smooth(p){if(p.length<2)return '';let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=` C${b[0]+(c[0]-a[0])/6},${Math.min(260,b[1]+(c[1]-a[1])/6)} ${c[0]-(e[0]-b[0])/6},${Math.min(260,c[1]-(e[1]-b[1])/6)} ${c[0]},${c[1]}`}return d}

function trendChart(B){const W=640,H=250,pl=44,pr=16,pt=22,pb=34,iw=W-pl-pr,ih=H-pt-pb,mx=Math.max(1,...B.flatMap(x=>[x.i,x.e]))*1.12,base=pt+ih,X=i=>pl+i*iw/(B.length-1),Y=v=>Math.min(base,pt+ih-v/mx*ih);

${[0,.25,.5,.75,1].map(f=>`<line x1='${pl}' y1='${Y(mx*f)}' x2='${W-pr}' y2='${Y(mx*f)}' stroke='#9aa8c6' stroke-opacity='.3' stroke-dasharray='${f?'4 4':'0'}'/><text x='${pl-6}' y='${Y(mx*f)+4}' font-size='10' text-anchor='end' fill='#9aa8c6'>${kf(mx*f)}</text>`).join('')}
<path d='${ar(pi)}' fill='url(#gi)'/><path d='${ar(pe)}' fill='url(#ge)'/><path d='${smooth(pi)}' fill='none' stroke='#12a594' stroke-width='3' stroke-linecap='round'/><path d='${smooth(pe)}' fill='none' stroke='#e0536a' stroke-width='3' stroke-linecap='round'/>${dots(pi,'#12a594','i')}${dots(pe,'#e0536a','e')}
${B[pk].e>0?`<text x='${Math.min(W-pr-30,Math.max(pl+30,pe[pk][0]))}' y='${pe[pk][1]-9}' font-size='11' font-weight='700' text-anchor='middle' fill='#e0536a'>Peak ${kf(B[pk].e)}</text>`:''}
${B.map((x,i)=>i%step==0||i==B.length-1?`<text x='${X(i)}' y='${H-10}' font-size='10' text-anchor='middle' fill='#9aa8c6'>${x.l}</text>`:'').join('')}</svg><div class='note'><span style='color:#12a594'>\u25cf</span> Income <span style='color:#e0536a'>\u25cf</span> Expenses &middot; hover or tap a point for the amount</div>`}
